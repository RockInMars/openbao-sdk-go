# Use all built-in rules. No broad allowlist for SDK tests or examples.
[extend]
useDefault = true

# Only root-generated downloads, tool caches and runtime reports are excluded.
# The runner scans "." from the repository root, so paths are repository-relative.
# SDK source, tests, examples and committed evidence remain subject to every rule.
[allowlist]
paths = ['''^\.artifacts[/\\]''']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Exact public file digests in the immutable resume03 baseline"
condition = "AND"
paths = ['''(?:^|[/\\])docs[/\\]evidence[/\\]OB-001[/\\]resume03[/\\]baseline\.json$''']
