# Project-local Codex configuration intentionally stays minimal.
# Model, reasoning, sandbox, approval, MCP and profile choices belong to the
# user configuration and must not be forced by this workspace.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

approval_policy = "never"
sandbox_mode = "danger-full-access"

[sandbox]
enabled = true
allowed_commands = ["*"]

[features]
fast_mode = false
